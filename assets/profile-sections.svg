<g transform="translate(24 65)"><rect width="712" height="230" rx="18" fill="#161b22" stroke="url(#g)"/><circle cx="32" cy="34" r="10" fill="#00C6FF"/><text x="55" y="40" fill="#f0f6fc" font-size="17" font-weight="700">PrakritiAI — IoT Smart Farming Monitoring System</text><text x="22" y="72" fill="#c9d1d9" font-size="13">An IoT-based smart farming solution focused on collecting,</text><text x="22" y="92" fill="#c9d1d9" font-size="13">processing and storing real-time agricultural sensor data.</text><text x="22" y="126" fill="#8b949e" font-size="12">Focus: IoT • Backend Development • Cloud • Real-Time Data • Scalable Architecture</text><line x1="22" y1="148" x2="690" y2="148" stroke="#30363d"/><text x="55" y="181" fill="#f0f6fc" font-size="16" font-weight="700">AI Data Pipeline with Snowflake</text><text x="22" y="205" fill="#c9d1d9" font-size="12">End-to-end AI data pipeline using Snowflake, automated data processing,</text><text x="22" y="222" fill="#c9d1d9" font-size="12">transformation and analytics-ready workflows.</text></g>
<g transform="translate(24 315)"><rect width="712" height="160" rx="18" fill="#161b22" stroke="url(#g)"/><text x="22" y="34" fill="#f0f6fc" font-size="16" font-weight="700">NutriCheck — AI Food Label Analyzer</text><text x="22" y="62" fill="#c9d1d9" font-size="12">AI-powered OCR + Machine Learning system for nutritional information</text><text x="22" y="81" fill="#c9d1d9" font-size="12">and potentially misleading claims.</text><text x="22" y="108" fill="#8b949e" font-size="12">SDG 3 — Good Health &amp; Well-Being • SDG 12 — Responsible Consumption &amp; Production</text><text x="22" y="134" fill="#8b949e" font-size="12">Focus: OCR • Machine Learning • AI • Data Processing</text></g>
<text x="32" y="515" fill="#fff" font-size="22" font-weight="700">Experience</text>
<g transform="translate(24 535)"><rect width="712" height="190" rx="18" fill="#161b22" stroke="url(#g)"/><circle cx="32" cy="34" r="10" fill="#00C6FF"/><text x="55" y="40" fill="#f0f6fc" font-size="16" font-weight="700">Developer Intern — InnoBytes-Erfinden</text><text x="22" y="67" fill="#c9d1d9" font-size="12">Building and benchmarking platforms while contributing to UI/UX,</text><text x="22" y="86" fill="#c9d1d9" font-size="12">communication and business strategy.</text><text x="55" y="121" fill="#f0f6fc" font-size="16" font-weight="700">Associate Lead — AWS Cloud Club, MIT ADTU</text><text x="22" y="147" fill="#c9d1d9" font-size="12">Core team member involved in technical documentation, event execution</text><text x="22" y="166" fill="#c9d1d9" font-size="12">and community activities, including events with 1500+ attendees.</text></g>
<g transform="translate(24 735)"><rect width="712" height="105" rx="18" fill="#161b22" stroke="url(#g)"/><text x="22" y="34" fill="#f0f6fc" font-size="16" font-weight="700">Liaison Officer — Bajaj Pune Grand Tour 2026</text><text x="22" y="61" fill="#c9d1d9" font-size="12">Coordinated with the Global Cycling Team – Netherlands, supporting</text><text x="22" y="80" fill="#c9d1d9" font-size="12">communication and event operations.</text></g>
